version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: grocery_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: grocery_db
      MYSQL_USER: grocery_user
      MYSQL_PASSWORD: grocery_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  aerospike:
    image: aerospike/aerospike-server-enterprise:8.1
    container_name: grocery_aerospike
    environment:
      NAMESPACE: grocery
      REPLICATION_FACTOR: 1
      MEM_GB: 1
      DEFAULT_TTL: 0
      FEATURE_KEY_FILE: /etc/aerospike/features.conf
    ports:
      - "3000:3000"
    volumes:
      - aerospike_data:/opt/aerospike/data
      - ./aerospike.conf:/etc/aerospike/aerospike.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "asadm", "-e", "info"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
  aerospike_data: 